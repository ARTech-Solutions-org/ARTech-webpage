kind = "web"
previewPath = "/"
title = "Zoom Parallax"
version = "1.0.0"
id = "artifacts/zoom-parallax"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20348

[services.development]
run = "pnpm --filter @workspace/zoom-parallax run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/zoom-parallax", "run", "build" ]
serve = "static"
publicDir = "artifacts/zoom-parallax/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20348"
BASE_PATH = "/"
